<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52677f"/></marker><style>
text{font-family:Arial,sans-serif;fill:#18283c}.title{font-size:34px;font-weight:700}.sub{font-size:17px;fill:#53677d}.head{font-size:19px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#53677d}.box{rx:16;stroke-width:2}.arrow{stroke:#52677f;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:8 7}
</style></defs>
<rect width="1600" height="1120" fill="#f5f8fc"/>
<text x="800" y="52" text-anchor="middle" class="title">Celia / AOK — معمارية النظام الحالية</text>
<text x="800" y="82" text-anchor="middle" class="sub">مسار Worker المقصود في المشروع والطبقات الموجودة — لا يثبت هذا الرسم وجود نشر Cloudflare حي</text>
<!-- deployed -->
<rect x="55" y="115" width="1490" height="300" rx="24" fill="#eef5ff" stroke="#6a91c5" stroke-width="2"/>
<text x="85" y="150" class="head">١) مسار Cloudflare المقصود في الشيفرة (النشر الحي غير متحقق)</text>
<rect x="95" y="185" width="260" height="165" class="box" fill="#fff" stroke="#4081c5"/><text x="225" y="220" text-anchor="middle" class="head">المستخدم</text><text x="225" y="252" text-anchor="middle" class="body">واجهة Celia Console</text><text x="225" y="279" text-anchor="middle" class="small">React + Vite</text><text x="225" y="314" text-anchor="middle" class="small">Pages (الـdeploy غير متحقق)</text>
<rect x="465" y="185" width="320" height="165" class="box" fill="#fff" stroke="#4081c5"/><text x="625" y="220" text-anchor="middle" class="head">Worker · تحقق Access JWT في الكود</text><text x="625" y="252" text-anchor="middle" class="body">JWT RS256 · issuer / audience / expiry</text><text x="625" y="279" text-anchor="middle" class="body">POST /run · GET /tasks · GET /runs</text><text x="625" y="314" text-anchor="middle" class="small">GET /runs/:id · حدود الطلب · CORS</text>
<rect x="900" y="185" width="285" height="165" class="box" fill="#fff" stroke="#6d73c9"/><text x="1042" y="220" text-anchor="middle" class="head">AOK Local Smoke Runner</text><text x="1042" y="252" text-anchor="middle" class="body">تنفيذ محلي محدود / Deny-by-default</text><text x="1042" y="279" text-anchor="middle" class="body">نتيجة + تحقق + أدلة + استخدام</text><text x="1042" y="314" text-anchor="middle" class="small">مسار smoke صريح، وليس ادعاء تكامل LLM كامل</text>
<rect x="1300" y="185" width="200" height="165" class="box" fill="#fff" stroke="#d39436"/><text x="1400" y="220" text-anchor="middle" class="head">D1 · البعيد غير متحقق</text><text x="1400" y="252" text-anchor="middle" class="body">سجل التشغيلات</text><text x="1400" y="279" text-anchor="middle" class="body">owner_id مع كل تشغيل</text><text x="1400" y="314" text-anchor="middle" class="small">استعلامات وفهارس حسب المالك</text>
<path d="M355 266 H455" class="arrow"/><text x="405" y="250" text-anchor="middle" class="small">HTTPS</text><path d="M785 266 H890" class="arrow"/><text x="837" y="250" text-anchor="middle" class="small">تشغيل</text><path d="M1185 266 H1290" class="arrow"/><text x="1237" y="250" text-anchor="middle" class="small">حفظ</text><path d="M1290 315 C1200 390 850 390 785 315" class="arrow"/><text x="1040" y="388" text-anchor="middle" class="small">استرجاع سجل التشغيلات والمهام</text>
<!-- repo modules -->
<text x="70" y="465" class="head">٢) طبقات ومستودعات التنفيذ الموجودة في هذا المستودع</text>
<rect x="65" y="495" width="1470" height="345" rx="22" fill="#fff" stroke="#9aabbc" stroke-width="2"/>
<rect x="90" y="530" width="280" height="265" class="box" fill="#f1f7ff" stroke="#4081c5"/><text x="230" y="565" text-anchor="middle" class="head">واجهات التطبيق</text><text x="115" y="605" class="body">• apps/console — واجهة المستخدم</text><text x="115" y="640" class="body">• apps/worker — API السحابي</text><text x="115" y="675" class="body">• apps/cli — Runner وCLI</text><text x="115" y="710" class="body">• apps/api — API محلي</text><text x="115" y="755" class="small">Workers + Pages ظاهر في STATUS</text>
<rect x="410" y="530" width="330" height="265" class="box" fill="#effaf6" stroke="#3a9a78"/><text x="575" y="565" text-anchor="middle" class="head">Runtime</text><text x="435" y="605" class="body">• orchestrator: DAG / جدولة</text><text x="435" y="640" class="body">• idempotency / retry / recovery</text><text x="435" y="675" class="body">• compensation / bulkhead</text><text x="435" y="710" class="body">• sandbox + scheduler</text><text x="435" y="755" class="small">استئناف التنفيذ واحتواء الفشل</text>
<rect x="780" y="530" width="330" height="265" class="box" fill="#f7f2ff" stroke="#8266b0"/><text x="945" y="565" text-anchor="middle" class="head">Kernel</text><text x="805" y="605" class="body">• عقود / قدرات / تنفيذ وسياسات</text><text x="805" y="640" class="body">• انتقالات الحالة + DAG</text><text x="805" y="675" class="body">• Events / Ledger / Projections</text><text x="805" y="710" class="body">• Identity / Provenance / Immune</text><text x="805" y="755" class="small">قواعد صلاحيات وأدلة وتحقق</text>
<rect x="1150" y="530" width="350" height="265" class="box" fill="#fff8ed" stroke="#d39436"/><text x="1325" y="565" text-anchor="middle" class="head">Plugins / Adapters / Storage</text><text x="1175" y="605" class="body">• Agents / Tools / GitHub</text><text x="1175" y="640" class="body">• Models / Memory / Verification</text><text x="1175" y="675" class="body">• Vault / Billing adapters</text><text x="1175" y="710" class="body">• SQLite dev/test + D1 للمسار السحابي</text><text x="1175" y="755" class="small">المكونات منفصلة كحزم داخل Monorepo</text>
<path d="M370 665 H400" class="arrow"/><path d="M740 665 H770" class="arrow"/><path d="M1110 665 H1140" class="arrow"/>
<!-- tests -->
<rect x="65" y="875" width="1470" height="170" rx="22" fill="#eefbf1" stroke="#5aab6e" stroke-width="2"/><text x="95" y="915" class="head">٣) التحقق والجودة (اختبارات في المستودع)</text><text x="105" y="960" class="body">Vitest: اختبارات kernel/runtime/apps/plugins/adapters</text><text x="610" y="960" class="body">Architecture Tests: قواعد الاعتماد والأمان والملكية</text><text x="1110" y="960" class="body">Harness: محاكاة فشل وإعادة تشغيل</text><text x="105" y="1005" class="small">تحقق محلي بالاختبارات؛ GitHub E2E الحقيقي متخطّى، والنشر الحي غير مثبت.</text>
<path d="M800 840 V865" class="arrow dash"/>
<text x="800" y="1085" text-anchor="middle" class="small">حدود مهمة: الحالة توثق M4 لمسارات المهام/التشغيل؛ بث الأحداث، الإلغاء، التصفح المُرقّم وتكاملات إضافية موضحة كأعمال مستقبلية في STATUS.md.</text>
</svg>